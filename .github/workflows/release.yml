# Release pipeline — builds the distributable artefacts, attaches them
# to a GitHub Release, and publishes the npm package.
#
# Triggered by pushing an annotated tag of the form `vX.Y.Z`. Manual
# dispatch is also supported so a maintainer can dry-run the matrix
# without cutting a tag.
#
# Artefacts produced:
#
#   1. cryptovote-x86_64-unknown-linux-gnu.tar.gz   — x64 Linux CLI (glibc-linked)
#   2. cryptovote-x86_64-unknown-linux-musl.tar.gz  — x64 Linux CLI (fully static musl)
#   3. cryptovote-aarch64-unknown-linux-gnu.tar.gz  — ARM64 Linux CLI (glibc-linked)
#   4. cryptovote-aarch64-unknown-linux-musl.tar.gz — ARM64 Linux CLI (fully static musl)
#   5. cryptovote-riscv64gc-unknown-linux-gnu.tar.gz — RISC-V 64 Linux CLI (glibc-linked)
#   6. cryptovote-aarch64-apple-darwin.tar.gz       — Apple Silicon macOS CLI
#   7. crypto_vote-wasm-browser.tar.gz              — wasm-pack bundle for browsers (wasm-bindgen,
#                                                     --target web: native ESM, no bundler needed).
#                                                     This is also the exact package published to
#                                                     npm (see below).
#   8. crypto_vote-extism.wasm                      — single `.wasm` for every Extism host SDK
#                                                     (shipped raw, not tarred: it is a single
#                                                     file fed straight to a host SDK, and the
#                                                     .sha256 then attests the exact bytes loaded)
#
# npm:
#   @condorcet.vote/crypto-vote                      — the wasm-pack `--target web` bundle (the same
#                                                     pkg-browser artefact as item 7). `--target web`
#                                                     emits a self-contained ESM with an async
#                                                     `init()` default export, instantiating the
#                                                     WASM itself via `new URL(..., import.meta.url)`
#                                                     + WebAssembly.instantiate. This works with no
#                                                     bundler at all and with every modern toolchain
#                                                     (Vite, Rollup, esbuild, Bun, Node) WITHOUT a
#                                                     plugin. The old `--target bundler` build was
#                                                     dropped: it relies on the non-standard
#                                                     WASM/ESM-integration that only webpack
#                                                     implements, so it broke under Vite (needs
#                                                     vite-plugin-wasm) and Bun (treats the .wasm as
#                                                     a static asset). Published to npmjs.com on
#                                                     every tag push via OIDC Trusted Publishing.
#
# crates.io:
#   crypto-vote                                      — the Rust crate itself, published on every tag
#                                                     push, also via OIDC Trusted Publishing. Note
#                                                     the two registries take their version number
#                                                     from different places — npm from the git tag,
#                                                     crates.io from `[package] version` — which is
#                                                     what the `preflight` job exists to reconcile.
#
# Note on item 4: `wasm64-unknown-unknown` is a Tier 3 target requiring
# nightly Rust, and several transitive dependencies (notably
# `curve25519-dalek` and `rand`) do not currently advertise wasm64
# support. We therefore ship `wasm32-wasip1` as the documented fallback,
# matching the user's "ou wasm32 si les dépendances ne le gèrent pas".
#
# Action pinning: every `uses:` here is pinned to a full-length commit SHA
# with the tag in a trailing comment, and Dependabot keeps them current.
# See the header of `ci.yml` for the full rationale — it matters more in
# this file than anywhere else, because the `publish-npm` job mints an
# OIDC id-token that can publish `@condorcet.vote/crypto-vote`. A mutable
# tag anywhere in this workflow would put that token behind code the
# action's owner can change after review.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Default `GITHUB_TOKEN` scope for the whole workflow: read-only. The two
# jobs that genuinely need more override it locally — `publish-npm` adds
# `id-token: write` for OIDC, `publish` needs `contents: write` to create
# the release — and a job-level block *replaces* this one wholesale rather
# than adding to it, so those overrides are complete as written. Setting
# the floor here means the six build jobs, which only compile and upload
# artefacts, cannot touch anything even if a dependency's build script
# goes looking for the token. Checkouts additionally pass
# `persist-credentials: false` so it is not left in `.git/config` either;
# see the header of `ci.yml`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate every other job on the tag agreeing with the manifest.
  #
  # The two registries read the version from different places: npm gets it
  # from the git tag (`npm pkg set version="${GITHUB_REF_NAME#v}"` below),
  # while crates.io reads `[package] version` in Cargo.toml. Nothing forced
  # them to agree — the manifest sat at 0.1.0 while v0.3.0 shipped — and
  # the failure mode is nasty: with crates.io in the loop, a forgotten bump
  # only surfaces at the very end, as `crate version already uploaded`,
  # after the GitHub Release and the npm package are already public and a
  # published version number can no longer be reused.
  #
  # Running as its own job rather than a step inside the builds means the
  # mismatch is caught in seconds, before six build matrices spin up.
  preflight:
    name: Preflight — tag ↔ manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match the version in Cargo.toml
        # Skipped on `workflow_dispatch`, which has no tag to compare
        # against. The job itself still runs and succeeds, so the manual
        # dry-run path keeps working — an `if:` on the *job* would mark it
        # skipped and take every dependent build down with it.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # tomllib rather than grep: it cannot be fooled by a commented-out
          # or same-named `version` key elsewhere in the manifest. Python
          # 3.11+ ships it in the stdlib and is preinstalled on the runner,
          # so this needs no toolchain and no install step.
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag  manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            # On stdout, not stderr: GitHub only parses `::error::` workflow
            # commands from the step's stdout stream.
            echo "::error::Tag v$tag and Cargo.toml version $manifest disagree." \
                 "Align [package] version with the tag, or delete and re-cut the tag" \
                 "at the intended commit, then push again."
            exit 1
          fi

  build-native:
    name: Native — ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel an ARM build when an x86 row fails (or vice versa);
      # we want to see every breakage in one CI run.
      fail-fast: false
      matrix:
        include:
          # --- Linux glibc ---
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            apt: ""
          - target: aarch64-unknown-linux-gnu
            # ARMv9-A cores (Cortex-A510, A710, A720, X1+ …) are 64-bit
            # ARM and use the `aarch64` ISA, so this triple covers
            # "native armv9" too — there is no separate Rust triple for
            # ARMv9 because ARMv9-A *is* AArch64. GitHub-hosted x86
            # runners produce ARM64 glibc binaries via the standard gcc
            # cross-compiler — no QEMU, no `cross`.
            os: ubuntu-latest
            apt: "gcc-aarch64-linux-gnu"
          # --- Linux musl (fully static, runs on any distro) ---
          - target: x86_64-unknown-linux-musl
            # `musl-tools` provides `musl-gcc`, which Cargo picks up
            # automatically for the *-linux-musl host triple.
            os: ubuntu-latest
            apt: "musl-tools"
          - target: aarch64-unknown-linux-musl
            # No apt cross-toolchain needed: `rust-lld` (bundled with
            # rustup) handles cross-arch linking, and rustup ships a
            # precompiled musl libc for this target. The linker env var
            # below selects rust-lld for this triple specifically.
            os: ubuntu-latest
            apt: ""
          # --- RISC-V 64 Linux (glibc only — see file header for why) ---
          - target: riscv64gc-unknown-linux-gnu
            # Tier 2 with host tools. Same pattern as aarch64-gnu: an apt
            # cross-toolchain provides the linker driver (`riscv64-linux-
            # gnu-gcc`) plus the matching crt and libc. No QEMU needed.
            os: ubuntu-latest
            apt: "gcc-riscv64-linux-gnu"
          # --- Apple Silicon macOS ---
          - target: aarch64-apple-darwin
            # macos-latest is Apple Silicon (M-series), so this build is
            # native — the Xcode CLT preinstalled on the runner provides
            # the linker. Intel macs (`x86_64-apple-darwin`) are not
            # shipped: GitHub-hosted Intel macOS runners were retired and
            # this project has no demand for a Rosetta-only artefact.
            os: macos-latest
            apt: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compile linker (apt)
        # Skipped automatically on macOS rows (no `apt:` value) and on
        # the aarch64-musl row (uses rust-lld instead of a system gcc).
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        # Each CARGO_TARGET_*_LINKER var is only consulted when its
        # triple is the active target, so setting all of them at once
        # is harmless on the rows that don't need them.
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cryptovote

      - name: Package binary
        id: pkg
        run: |
          STAGING="cryptovote-${{ matrix.target }}"
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/cryptovote "$STAGING/"
          cp README.md "$STAGING/" 2>/dev/null || true
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          # Print sha256 alongside the artefact for downstream verification.
          sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          echo "archive=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cryptovote-${{ matrix.target }}
          path: |
            cryptovote-${{ matrix.target }}.tar.gz
            cryptovote-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  build-wasm-browser:
    name: WASM — browser (wasm32-unknown-unknown via wasm-pack)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Why `cargo install` rather than the official installer script?
        # The `rustwasm.github.io/wasm-pack/installer/init.sh` URL is a
        # stale snapshot — the repo moved from `rustwasm/wasm-pack` to
        # `wasm-bindgen/wasm-pack` (July 2025) and the old Pages site
        # serves a frozen `init.sh` pinned to v0.13.1, which predates
        # support for the `--profile <name>` CLI flag we use for the
        # `wasm-release` Cargo profile. crates.io is always in sync with
        # the live releases, so `cargo install` is the reliable path.
        # `--locked` uses wasm-pack's own Cargo.lock for a reproducible
        # build.
        run: cargo install wasm-pack --locked

      - name: Build browser bundle
        # `--target web` emits ESM glue suitable for native ES modules
        # in a browser. The `wasm` feature gates the wasm-bindgen
        # surface; `--no-default-features` drops the CLI bin from the
        # build graph so clap doesn't get pulled into the bundle.
        # `--profile wasm-release` selects the WebAssembly-tuned profile
        # that pins `panic = "abort"` (see Cargo.toml for the rationale
        # — the plain `release` profile leaves panic at the default to
        # avoid the cdylib/cargo-bench build-graph collision).
        run: |
          wasm-pack build \
            --profile wasm-release \
            --target web \
            --out-dir pkg-browser \
            -- \
            --no-default-features \
            --features wasm \
            --locked

      - name: Package browser bundle
        run: |
          tar -czf crypto_vote-wasm-browser.tar.gz pkg-browser
          sha256sum crypto_vote-wasm-browser.tar.gz > crypto_vote-wasm-browser.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crypto_vote-wasm-browser
          path: |
            crypto_vote-wasm-browser.tar.gz
            crypto_vote-wasm-browser.tar.gz.sha256
          if-no-files-found: error

      - name: Upload raw pkg-browser dir (for npm publish)
        # The tarball above is the GitHub Release asset; npm publish needs the
        # unpacked package directory, so upload it separately.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crypto_vote-pkg-browser
          path: pkg-browser/
          if-no-files-found: error

  build-wasm-extism:
    name: WASM — Extism plugin (wasm32-wasip1)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (wasm32-wasip1)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32-wasip1-extism

      - name: Build Extism plugin
        # Same target triple as the plain WASI build, but with the
        # `extism` feature on instead of the default `cli`. WASI's
        # `random_get` feeds `SysRng` directly, so no extra getrandom
        # backend is needed. The resulting `.wasm` runs in every Extism
        # host SDK (browser via `@extism/extism`, Node, Python, Go, …).
        # `--profile wasm-release` picks the WASM-tuned profile that
        # adds `panic = "abort"` on top of release (see Cargo.toml).
        run: cargo build --profile wasm-release --locked --target wasm32-wasip1 --lib --no-default-features --features extism

      - name: Package Extism plugin
        # Ship the `.wasm` raw rather than tarred: it is a single file
        # handed straight to a host SDK (`extism call …`, @extism/extism,
        # the Python/Go/Rust SDKs), so there is nothing to extract and no
        # README to bundle. Hashing the bare file means the .sha256
        # attests exactly the bytes a host loads, with no tar/gzip
        # metadata in between.
        run: |
          cp target/wasm32-wasip1/wasm-release/crypto_vote.wasm crypto_vote-extism.wasm
          sha256sum crypto_vote-extism.wasm > crypto_vote-extism.wasm.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crypto_vote-extism
          path: |
            crypto_vote-extism.wasm
            crypto_vote-extism.wasm.sha256
          if-no-files-found: error

  publish-npm:
    name: Publish — npmjs (@condorcet.vote/crypto-vote)
    # Only fire on tag pushes. Manual `workflow_dispatch` runs build the
    # browser artefact (useful for smoke-testing the pipeline) but skip
    # the publish step to avoid accidental releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      # Publish the very same `--target web` bundle built for the browser
      # release asset — one artefact, one build, no bundler-specific variant.
      - build-wasm-browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC Trusted Publishing: npm verifies the short-lived
      # id-token against the trusted publisher configuration set on npmjs.com.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crypto_vote-pkg-browser
          path: pkg-browser

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package name and version
        # wasm-pack derives the package name from the Cargo crate name
        # (`crypto-vote`). Override it to the published scope + name, and
        # align the version with the git tag (strip the leading `v`).
        run: |
          cd pkg-browser
          npm pkg set name="@condorcet.vote/crypto-vote"
          npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Update npm for OIDC Trusted Publishing
        # OIDC Trusted Publishing requires npm >= 11.5.1; the runner ships
        # an older version.
        run: sudo npm install -g npm@latest

      - name: Publish to npm
        # `--access public` is required for scoped packages to be publicly
        # accessible. Authentication is handled by the OIDC id-token —
        # no NODE_AUTH_TOKEN needed.
        run: cd pkg-browser && npm publish --access public

  publish-crates-io:
    name: Publish — crates.io (crypto-vote)
    # Tag pushes only, like the other publish jobs: a manual
    # `workflow_dispatch` builds everything but must never publish.
    if: startsWith(github.ref, 'refs/tags/v')
    # Gated on *every* build, not just the native one. Publishing to
    # crates.io is the least reversible step in this pipeline — a version
    # can be yanked but never replaced or deleted, and the number is burnt
    # for good. If any target fails to build we would rather ship nothing
    # than mint an immutable version whose WASM artefacts are missing.
    needs:
      - build-native
      - build-wasm-browser
      - build-wasm-extism
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Trusted Publishing: crates.io verifies this
      # short-lived id-token against the trusted publisher configured on
      # the crate. Note that configuration pins the *workflow filename* —
      # renaming or splitting `release.yml` silently breaks the exchange
      # and surfaces as an opaque auth failure, so update it on crates.io
      # first if this file ever moves.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Exchange the OIDC id-token for a crates.io token
        id: auth
        # Mints a short-lived registry token and revokes it in its own
        # post-job step, so nothing durable is stored anywhere — the same
        # reason npm publishes via OIDC rather than a repository secret.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        # `--locked` publishes against the committed Cargo.lock instead of
        # re-resolving, so the archive matches what CI tested. The version
        # comes from `[package] version`, which the `preflight` job has
        # already checked against the tag.
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish:
    name: Publish GitHub Release
    # Only fire when the workflow was triggered by a tag push. Manual
    # `workflow_dispatch` runs still build the artefacts above (useful
    # for smoke-testing the pipeline) but skip the release step.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-native
      - build-wasm-browser
      - build-wasm-extism
    runs-on: ubuntu-latest
    permissions:
      # `softprops/action-gh-release` needs write access to create the
      # release and upload assets via the GitHub REST API.
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      - name: Flatten artefact tree
        # `download-artifact` nests each artefact under its name; the
        # release uploader takes a flat file list, so we move everything
        # into one directory.
        run: |
          mkdir release-files
          find artefacts -type f \( -name "*.tar.gz" -o -name "*.wasm" -o -name "*.sha256" \) -exec mv {} release-files/ \;
          ls -la release-files

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
